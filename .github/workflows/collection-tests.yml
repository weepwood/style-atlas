name: UI Collection tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collection-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate collection data and backups
        run: node --experimental-strip-types --test tests/*.test.mjs
